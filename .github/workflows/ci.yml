# Continuous integration for every pull request and every push to main (spec 02 §5).
# Third-party actions are pinned to full commit SHAs (tag shown in the trailing comment).
# No job uses production credentials, and no job deploys anything.
#
# Path-aware and fail-closed (OI-70, docs/DEVELOPMENT.md §5):
# - "changes" classifies a pull request as docs-only or full, using the classifier from the
#   pull request's BASE commit. Any doubt, error, push, or manual run means "full".
# - quality, audit, and secrets always run. e2e and lighthouse are skipped only for
#   docs-only pull requests.
# - "CI result" is the required aggregate check. It passes only if every suite required
#   for the scope succeeded, and it reports skipped suites as "not run", never as passed.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request runs are cancelled. Runs on main always complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Deterministic, credential-free test configuration (see .env.example).
  APP_ENV: test
  NEXT_PUBLIC_SITE_URL: http://localhost:3100

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Classify (base-commit classifier; fails closed to full)
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          trusted="$RUNNER_TEMP/classify-changes.mjs"
          if [ "$EVENT_NAME" = "pull_request" ] &&
             git show "${BASE_SHA}:scripts/ci/classify-changes.mjs" > "$trusted" 2>/dev/null; then
            node "$trusted" classify >> "$GITHUB_OUTPUT"
          else
            echo "CI scope: full (no pull request, or no trusted classifier on the base commit)" >&2
            echo "scope=full" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Lint, types, format, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test

  e2e:
    name: Database, integration, and e2e tests (local Supabase)
    needs: changes
    if: needs.changes.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Local Supabase stack only (spec 03 §15): no hosted project, no real email.
      SUPABASE_CLI_VERSION: 3.2.0
      # SHA-256 of supabase_3.2.0_linux_amd64.tar.gz from the official release checksums.txt.
      SUPABASE_CLI_SHA256: fb88b175a817563505be02c60872060bcb8d5c869a1aa5656eaeb085d4a2f1e4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Migration immutability check (T-MIG-02)
        run: ./scripts/check-migrations.sh "origin/${GITHUB_BASE_REF:-main}"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Supabase CLI (checksum verified)
        run: |
          archive="supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/${archive}"
          echo "${SUPABASE_CLI_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/supabase-cli"
          tar -xzf "$archive" -C "$RUNNER_TEMP/supabase-cli" supabase
          echo "$RUNNER_TEMP/supabase-cli" >> "$GITHUB_PATH"
      - name: Start the local Supabase stack
        run: supabase start
      - name: Export local stack configuration
        # The local stack's well-known development keys; nothing here is a real credential.
        run: |
          supabase status -o json > "$RUNNER_TEMP/supabase-status.json"
          secret="$(jq -r .SECRET_KEY "$RUNNER_TEMP/supabase-status.json")"
          echo "::add-mask::${secret}"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/supabase-status.json")"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY "$RUNNER_TEMP/supabase-status.json")"
            echo "SUPABASE_SECRET_KEY=${secret}"
            echo "SUPABASE_DB_URL=$(jq -r .DB_URL "$RUNNER_TEMP/supabase-status.json")"
            echo "MAILPIT_URL=$(jq -r .MAILPIT_URL "$RUNNER_TEMP/supabase-status.json")"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/supabase-status.json"
      - name: Apply every migration and the synthetic seed from scratch (T-MIG-01)
        run: supabase db reset
      - name: Database tests (pgTAP)
        run: supabase test db
      - name: WP-D18 isolated concurrent-commit verification
        run: ./scripts/wpd18-isolated-commit-test.sh
        timeout-minutes: 5
      - name: Integration tests
        run: pnpm test:integration
      - run: pnpm build
      - name: Client bundle secret check (T-SEC-01)
        run: pnpm check:bundle
      - name: Production-mode build for gating tests (never deployed)
        run: pnpm build:production-check
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      # Bounded install: each attempt is capped at 5 minutes and retried once, so a stalled
      # download fails fast instead of consuming the job timeout.
      - name: Install Chromium and system dependencies (bounded, one retry)
        timeout-minutes: 12
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then target="install-deps"; else target="install --with-deps"; fi
          for attempt in 1 2; do
            if timeout 300 pnpm exec playwright $target chromium; then exit 0; fi
            echo "Playwright $target attempt $attempt failed or timed out" >&2
          done
          exit 1
      - name: Generate a test-only webhook signing secret for this run (OI-63)
        # Random per run, never a Stripe secret; only the test-build server and the WP-B spec read it.
        run: |
          secret="whsec_$(openssl rand -hex 24)"
          echo "::add-mask::${secret}"
          echo "E2E_STRIPE_WEBHOOK_SECRET=${secret}" >> "$GITHUB_ENV"
      - run: pnpm test:e2e
        timeout-minutes: 15
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Stop the local Supabase stack
        if: always()
        run: supabase stop --no-backup

  lighthouse:
    name: Lighthouse budgets (spec 02 §7)
    needs: changes
    if: needs.changes.outputs.scope != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3200
      # Public pages only; no Supabase stack runs in this job. Placeholder key shapes.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      SUPABASE_SECRET_KEY: sb_secret_placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Results stay on the runner (filesystem target); nothing is uploaded publicly.
      - run: pnpm lhci
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the official release checksums.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
      - name: Scan git history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  ci-result:
    name: CI result
    needs: [changes, quality, e2e, lighthouse, audit, secrets]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Evaluate required suites (base-commit evaluator; fails closed)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RESULT_QUALITY: ${{ needs.quality.result }}
          RESULT_AUDIT: ${{ needs.audit.result }}
          RESULT_SECRETS: ${{ needs.secrets.result }}
          RESULT_E2E: ${{ needs.e2e.result }}
          RESULT_LIGHTHOUSE: ${{ needs.lighthouse.result }}
        run: |
          trusted="$RUNNER_TEMP/classify-changes.mjs"
          if [ "$EVENT_NAME" = "pull_request" ] &&
             git show "${BASE_SHA}:scripts/ci/classify-changes.mjs" > "$trusted" 2>/dev/null; then
            node "$trusted" evaluate
          else
            # No trusted evaluator on the base commit (or not a pull request): every job must
            # have run and passed.
            for result in "$CHANGES_RESULT" "$RESULT_QUALITY" "$RESULT_AUDIT" "$RESULT_SECRETS" \
                          "$RESULT_E2E" "$RESULT_LIGHTHOUSE"; do
              if [ "$result" != "success" ]; then
                echo "CI result: failed (strict mode; a job result was '$result')" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            done
            echo "CI result: passed (strict mode; every suite ran and passed)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
